<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}آبدیت{% endblock %} · آبدیت</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark abdit-nav">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">💧 آبدیت</a>
    {% if user %}
    <div class="d-flex align-items-center gap-3">
      <span class="navbar-text text-white-50 small">
        {{ user.full_name }} · <span class="badge bg-light text-dark">{{ t_role[user.role] }}</span>
      </span>
      <form method="post" action="/logout" class="m-0">
        <button class="btn btn-sm btn-outline-light" type="submit">خروج</button>
      </form>
    </div>
    {% else %}
    <a class="btn btn-sm btn-outline-light" href="/login">ورود</a>
    {% endif %}
  </div>
</nav>

<div class="container-fluid py-4">
  {% if user %}
  <div class="row">
    <aside class="col-md-2 mb-3">
      {% block sidebar %}{% endblock %}
    </aside>
    <main class="col-md-10">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
  <main>{% block public %}{% endblock %}</main>
  {% endif %}
</div>

<footer class="text-center text-muted small py-3">
  نمونهٔ اولیهٔ آبدیت · {{ now().year }}
</footer>
</body>
</html>
