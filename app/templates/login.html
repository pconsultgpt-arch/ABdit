{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block public %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h4 class="card-title">ورود به حساب کاربری</h4>
        {% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label">ایمیل</label>
            <input class="form-control" name="email" type="email" required dir="ltr">
          </div>
          <div class="mb-3">
            <label class="form-label">رمز عبور</label>
            <input class="form-control" name="password" type="password" required value="password" dir="ltr">
          </div>
          <button class="btn btn-primary w-100" type="submit">ورود</button>
        </form>
        <hr>
        <p class="text-muted small mb-0">هر یک از حساب‌های نمایشی صفحهٔ اصلی قابل استفاده است. رمز عبور همهٔ آن‌ها <code>password</code> است.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
